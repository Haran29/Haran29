name: koi

on:
  schedule:
    - cron: "20 0 * * *"   # daily, 00:20 UTC
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/koi.yml

permissions:
  contents: write

concurrency:
  group: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yalongwastaken/git-koi@v1
        with:
          body: white        # white | black | asagi | tea | gold | platinum
          output-dir: koi

      - name: Commit koi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add koi/koi.gif
          git diff --cached --quiet || (git commit -m "Update koi" && git push)
